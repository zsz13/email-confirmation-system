# Serves the Angular production build and proxies the API, so the browser only ever talks to
# this origin: same-origin /api/v1 requests, no CORS, no hard-coded backend address.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS, re-queried so a recreated backend container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # NGINX serves .js as text/javascript; application/javascript is kept for proxied bodies.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, the OpenAPI document, Swagger UI and the admin panel, all answered by the backend.
    # A separate file because the production edge proxy includes the same locations.
    include /etc/nginx/snippets/backend-locations.conf;

    # Bundles carry a content hash in their file name, so they can be cached indefinitely.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/headers.conf;
    }

    # The entry point is never cached, so a new deployment is picked up on the next load.
    location = /index.html {
        expires -1;
    }

    # Single-page application: unknown paths render the app, which owns routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
