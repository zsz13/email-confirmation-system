# Locations answered by the backend: the API, the OpenAPI document, Swagger UI and the admin
# panel. Included by frontend/nginx.conf (local stack) and by the production edge proxy
# (deploy/nginx.conf.template), so both route these paths, send these headers and keep these log
# rules identically. The including server block defines the resolver and $backend.
#
# A new backend path belongs here, not in frontend/nginx.conf: in production only these
# locations reach the backend directly with the client's address and scheme. No location here
# may use `return`: it runs before the access phase, so at the edge it would answer without
# Basic Auth.
#
# Authorization is cleared on the way upstream in every location: the backend uses no HTTP
# authentication, and in production the header carries the edge's Basic Auth credentials, which
# stop at the edge.

# API plus the OpenAPI document, both answered by FastAPI.
location ~ ^/(api/|openapi\.json$) {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwritten rather than appended, so a client cannot spoof its own address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}

# Swagger UI, answered by FastAPI. Its page loads the swagger-ui bundle and stylesheet from
# cdn.jsdelivr.net and starts them with an inline script, all of which the SPA's policy
# blocks, so this one page gets a policy of its own. It is fixed HTML with nothing
# user-supplied in it. The upstream path is pinned: matching happens on the normalised
# URI, so an encoded "/other%2F..%2Fdocs" must not carry this policy to another page.
location = /docs {
    proxy_pass $backend/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}

# Read-only admin panel (SQLAdmin), served by the backend. The path is the ADMIN_PATH
# default from backend/app/core/config.py; a deployment that overrides it changes this
# prefix too. The panel is a classic server-rendered app with its own scripts and inline
# styles, so it gets its own headers rather than the SPA's stricter policy.
location ^~ /q7Vf2mZ9Kx4Tn8Rb3Lp6Hs1Yw5Dc0Gj4Ua9Pe2Nr7Bk6Xv3Qm8Sf1Zh5Wt0Cy4Ld9Jp2En7 {
    # Not logged here: every line would carry the panel's path, and its search requests
    # the names and addresses an admin looked for. The backend logs these requests
    # itself, with the path replaced by a placeholder. The error log is kept to critical
    # entries for the same reason: its upstream and failed-authentication lines quote the
    # request line. An unreachable backend still shows up in the other locations' errors.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    proxy_pass $backend;
    proxy_http_version 1.1;
    # The panel builds absolute URLs (assets, redirects) from the Host header, so it must
    # see the one the browser sent, port included ($host would drop the port).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # No Referer at all: the browser's own /favicon.ico request would otherwise carry the
    # panel's URL, search terms included, into the access log of the location serving it.
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
