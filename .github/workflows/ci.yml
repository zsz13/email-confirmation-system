name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, Pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Tests use SQLite and a fake Mailjet transport; no credentials, no network, no email.
      - run: uv run pytest

  frontend:
    name: Frontend (ESLint, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The version comes from the packageManager field; the file is not at the repo root.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Production bundle must use same-origin API URLs
        run: |
          if grep -q 'localhost:8000' dist/frontend/browser/*.js; then
            echo 'The production bundle hard-codes the development backend address.' >&2
            exit 1
          fi
      - name: Footer repository link must point at this repository
        run: grep -F "https://github.com/${GITHUB_REPOSITORY}'" src/app/app.ts

  docker:
    name: Docker (compose config, image builds, integration smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Provide placeholder settings so the Compose files can be validated
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.integration.yaml config --quiet
      - run: docker compose build
      # Real images, real MySQL, real migrations; email goes to an in-network stub of the
      # Mailjet API (compose.integration.yaml), so no credential and no email is involved.
      - name: Integration smoke test
        run: ./scripts/integration-test.sh
